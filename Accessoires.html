<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Accessoires — Kalao Boutique</title>

<link href="./dist/output.css" rel="stylesheet">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">

<style>
  body { background-color: #F5F8FF; }
  .card-lift { transition: transform .35s cubic-bezier(.2,.8,.2,1), box-shadow .35s ease; }
  .card-lift:hover { transform: translateY(-6px); box-shadow: 0 18px 34px -14px rgba(15,102,83,0.35); }
  .underline-grow { position: relative; }
  .underline-grow::after {
    content: ''; position: absolute; left: 0; bottom: -3px; height: 2px; width: 0%;
    background: currentColor; transition: width .3s ease;
  }
  .underline-grow:hover::after { width: 100%; }
  .brand-active { color: #D8452F; }
  .brand-active::after { width: 100% !important; background: #D8452F; }
  .type-pill { transition: background .2s ease, color .2s ease, border-color .2s ease; }
  .type-active { background: #1A56DB; color: white; border-color: #1A56DB; }
</style>
</head>
<body class="font-body text-coal">

<header class="bg-ivory border-b border-sand sticky top-0 z-40">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 py-4">
    <div class="flex flex-col md:flex-row md:items-center gap-4">
      <div class="flex items-center gap-4 flex-1 min-w-0">
        <a href="index.html" class="flex items-center gap-2 shrink-0">
          <div class="w-10 h-10 rounded-full bg-emerald-deep flex items-center justify-center text-ivory font-display text-lg">K</div>
          <span class="font-display text-2xl font-semibold tracking-tight text-coal">Kalao<span class="text-emerald-deep">.</span></span>
        </a>
        <div class="flex-1 max-w-xl">
          <div class="flex items-center bg-white border border-sand rounded-full pl-4 pr-1.5 py-1.5 shadow-sm focus-within:ring-2 focus-within:ring-emerald-deep/30 focus-within:border-emerald-deep transition">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-coal/40 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35m1.35-5.15a7.5 7.5 0 11-15 0 7.5 7.5 0 0115 0z"/>
            </svg>
            <input type="text" placeholder="Cherchez un article, une marque, une catégorie…" class="w-full bg-transparent outline-none text-sm px-3 py-1.5 placeholder:text-coal/40">
            <button class="bg-emerald-deep hover:bg-emerald-dark transition text-ivory text-sm font-semibold px-5 py-2 rounded-full shrink-0">Rechercher</button>
          </div>
        </div>
      </div>

      <div class="flex items-center justify-end gap-6 shrink-0">
       <a href="connexion.html" target="_blank" class="flex items-center gap-2 text-sm font-medium underline-grow">
  <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
    <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.5 20.25a8.25 8.25 0 0115 0"/>
  </svg>
  Se connecter
</a>
        <div class="relative group">
          <button class="flex items-center gap-1 text-sm font-medium underline-grow">
            Catégories
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 mt-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/>
            </svg>
          </button>
          <div class="absolute right-0 top-full pt-2 w-52 opacity-0 invisible group-hover:opacity-100 group-hover:visible transition">
            <div class="bg-white border border-sand rounded-xl shadow-lg py-2">
              <a href="ordinateurs.html" target="_blank" class="block px-4 py-2 text-sm hover:bg-sand/60">Ordinateurs</a>
              <a href="tablettes.html" target="_blank" class="block px-4 py-2 text-sm hover:bg-sand/60">Tablettes</a>
              <a href="smartphones.html" target="_blank" class="block px-4 py-2 text-sm hover:bg-sand/60">Smartphones</a>
              <a href="accessoires.html" target="_blank" class="block px-4 py-2 text-sm hover:bg-sand/60">Accessoires</a>
            </div>
          </div>
        </div>

        <button class="relative flex items-center gap-2 text-sm font-medium">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
            <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 3h1.386c.51 0 .955.343 1.087.836l.383 1.437M7.5 14.25a3 3 0 00-3 3h15.75m-12.75-3h11.218c1.121-2.3 1.94-4.693 2.435-7.152.078-.383-.22-.738-.611-.738H5.106M7.5 14.25L5.106 5.25M7.5 14.25L5.106 5.25m6.144 8.995V18.75m-.75-9h9.75" stroke-linejoin="round"/>
          </svg>
          Panier
          <span id="cart-count" class="absolute -top-2 -right-3 bg-ember text-white text-[10px] font-bold w-5 h-5 rounded-full flex items-center justify-center">0</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Barre des marques -->
  <nav class="border-t border-sand bg-white/60">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 flex gap-8 overflow-x-auto text-sm font-medium py-3 no-scrollbar">
      <button onclick="showBrand('Dell', this)" class="brand-btn underline-grow whitespace-nowrap">Dell</button>
      <button onclick="showBrand('HP', this)" class="brand-btn underline-grow whitespace-nowrap">HP</button>
      <button onclick="showBrand('Victus', this)" class="brand-btn underline-grow whitespace-nowrap">Victus</button>
      <button onclick="showBrand('Asus', this)" class="brand-btn underline-grow whitespace-nowrap">Asus</button>
      <button onclick="showBrand('Acer', this)" class="brand-btn underline-grow whitespace-nowrap">Acer</button>
      <button onclick="showBrand('Macbook', this)" class="brand-btn underline-grow whitespace-nowrap">Macbook</button>
      <button onclick="showBrand('Lenovo', this)" class="brand-btn underline-grow whitespace-nowrap">Lenovo</button>

      <button onclick="showBrand('Logitech', this)" class="brand-btn underline-grow whitespace-nowrap">Logitech</button>
      <button onclick="showBrand('Composants', this)" class="brand-btn underline-grow whitespace-nowrap">Composants</button>
    </div>
  </nav>
</header>

<main class="max-w-7xl mx-auto px-4 sm:px-6 py-10">
  <div class="flex items-baseline justify-between mb-6">
    <h1 class="font-display text-3xl font-semibold" id="page-title">Accessoires</h1>
    <span class="text-sm text-coal/50" id="grid-count"></span>
  </div>
  <p class="text-sm text-coal/50 mb-4" id="page-subtitle">Choisissez une marque ci-dessus</p>

  <div class="flex flex-wrap gap-3 mb-8" id="type-nav"></div>

  <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-5" id="product-grid"></div>
</main>

<footer class="bg-emerald-dark text-ivory/80 mt-16">
  <div class="max-w-7xl mx-auto px-6 py-10 text-sm flex flex-col sm:flex-row justify-between gap-4">
    <p class="font-display text-lg text-ivory">Kalao Boutique</p>
    <p>© 2026 Kalao Boutique — Tous droits réservés.</p>
  </div>
</footer>

<script>
  // Les types d'accessoires disponibles pour chaque marque
  const brandTypes = {
    "Dell": ["Chargeur", "Adaptateur secteur", "Housse de protection", "Batterie"],
    "HP": ["Chargeur", "Adaptateur secteur", "Housse de protection", "Batterie"],
    "Victus": ["Chargeur", "Adaptateur secteur", "Housse de protection", "Batterie"],
    "Asus": ["Chargeur", "Adaptateur secteur", "Housse de protection", "Batterie"],
    "Acer": ["Chargeur", "Adaptateur secteur", "Housse de protection", "Batterie"],
    "Macbook": ["Chargeur", "Adaptateur secteur", "Housse de protection", "Batterie"],
    "Lenovo": ["Chargeur", "Adaptateur secteur", "Housse de protection", "Batterie"],
    "Logitech": ["Souris", "Clavier", "Casque", "Webcam"],
    "Composants": ["Carte mère", "Barrette RAM", "Disque dur / SSD", "Câbles"]
  };

  // Ajoutez vos produits ici. "brand" et "type" doivent correspondre exactement
  // aux valeurs de brandTypes ci-dessus.
  const products = [
    // Exemple à copier/adapter :
    // { brand: "Logitech", type: "Souris", name: "Souris sans fil M170", price: 8000, oldPrice: 12000, discount: 33, stock: 15, rating: 4.5, reviews: 40, whatsapp: "22900000000", image: "images/souris1.jpeg" },
    { brand: "Dell", type: "Chargeur", name: "Chargeur Dell XPS 13", price: 8000, oldPrice: 12000, discount: 33, stock: 15, rating: 4.5, reviews: 40, whatsapp: "22900000000", image: "images/im13.jpeg" },
    { brand: "Logitech", type: "Clavier", name: "Clavier mécanique K120", price: 15000, oldPrice: 20000, discount: 25, stock: 10, rating: 4.2, reviews: 30, whatsapp: "22900000001", image: "images/clavier1.jpeg" },
    { brand: "Logitech", type: "Casque", name: "Casque gaming G332", price: 25000, oldPrice: 30000, discount: 17, stock: 5, rating: 4.7, reviews: 50, whatsapp: "22900000002", image: "images/casque1.jpeg" },
    { brand: "Logitech", type: "Webcam", name: "Webcam HD C270", price: 12000, oldPrice: 15000, discount: 20, stock: 8, rating: 4.3, reviews: 25, whatsapp: "22900000003", image: "images/webcam1.jpeg" },
    { brand: "Composants", type: "Carte mère", name: "Carte mère ASUS ROG Strix B550-F", price: 80000, oldPrice: 100000, discount: 20, stock: 3, rating: 4.6, reviews: 15, whatsapp: "22900000004", image: "images/carte_mere1.jpeg" },
    { brand: "Composants", type: "Barrette RAM", name: "Barrette RAM Corsair Vengeance LPX 16GB (2x8GB) DDR4-3200", price: 40000, oldPrice: 50000, discount: 20, stock: 12, rating: 4.8, reviews: 22, whatsapp: "22900000005", image:"images/ram1.jpeg" },
    { brand:"Composants", type:"Disque dur
  ];

  function starRow(rating) {
    let out = '';
    for (let i = 1; i <= 5; i++) {
      out += `<svg class="w-3.5 h-3.5" style="color:${i <= Math.round(rating) ? '#C99A2E' : '#E4DCC8'}" fill="currentColor" viewBox="0 0 20 20"><path d="M10 15.27L16.18 19l-1.64-7.03L20 7.24l-7.19-.61L10 0 7.19 6.63 0 7.24l5.46 4.73L3.82 19z"/></svg>`;
    }
    return out;
  }

  let currentBrand = null;
  let currentType = null;

  function showBrand(brand) {
    currentBrand = brand;
    currentType = null;

    document.querySelectorAll('.brand-btn').forEach(b => {
      b.classList.toggle('brand-active', b.textContent === brand);
    });

    document.getElementById('page-title').textContent = `Accessoires — ${brand}`;
    document.getElementById('page-subtitle').textContent = 'Choisissez un type d\'accessoire';

    const typeNav = document.getElementById('type-nav');
    typeNav.innerHTML = brandTypes[brand].map(type => `
      <button onclick="showType('${type}', this)" class="type-pill type-btn bg-white border border-sand rounded-full px-5 py-2 text-sm font-medium">${type}</button>
    `).join('');

    document.getElementById('product-grid').innerHTML = `<p class="col-span-full text-sm text-coal/50">Choisissez un type d'accessoire ci-dessus pour voir les articles.</p>`;
    document.getElementById('grid-count').textContent = '';
  }

  function showType(type, btn) {
    currentType = type;
    document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('type-active'));
    btn.classList.add('type-active');

    document.getElementById('page-subtitle').textContent = `${currentBrand} — ${type}`;

    const indices = brandTypes[currentBrand]?.includes(type) ? [] : [];
    products.forEach((p, i) => {
      if (p.brand === currentBrand && p.type === type) indices.push(i);
    });

    document.getElementById('grid-count').textContent = `${indices.length} article${indices.length > 1 ? 's' : ''}`;

    const grid = document.getElementById('product-grid');
    grid.innerHTML = '';

    if (indices.length === 0) {
      grid.innerHTML = `<p class="col-span-full text-sm text-coal/50">Aucun article "${type}" pour ${currentBrand} pour l'instant. Revenez bientôt !</p>`;
      return;
    }

    indices.forEach(i => {
      const p = products[i];
      const card = document.createElement('div');
      card.className = 'card-lift bg-white rounded-2xl border border-sand overflow-hidden flex flex-col';
      card.innerHTML = `
        <div class="relative aspect-square overflow-hidden">
          <span class="absolute top-2 left-2 bg-ember text-white text-[11px] font-bold px-2 py-1 rounded-md z-10">-${p.discount}%</span>
          <img src="${p.image}" alt="${p.name}" class="w-full h-full object-cover">
        </div>
        <div class="p-3 flex flex-col gap-1.5 flex-1">
          <p class="font-mono font-semibold text-lg leading-none">${p.price.toFixed(2)} <span class="text-xs font-body">FCFA</span></p>
          <p class="text-xs text-coal/40 line-through">${p.oldPrice.toFixed(2)} FCFA</p>
          <p class="text-sm font-medium leading-snug line-clamp-2 mt-1">${p.name}</p>
          <div class="flex items-center gap-1 mt-1">
            ${starRow(p.rating)}
            <span class="text-[11px] text-coal/50 ml-1">(${p.reviews})</span>
          </div>
          <p class="text-[11px] text-coal/50 mt-1">${p.stock} article${p.stock > 1 ? 's' : ''} restant${p.stock > 1 ? 's' : ''}</p>
          <div class="flex flex-col gap-1.5 mt-2">
            <button onclick="addToCart(this)" class="bg-emerald-deep hover:bg-emerald-dark transition text-ivory text-xs font-semibold py-2 rounded-lg">Ajouter au panier</button>
            <button onclick="removeFromCart(this)" class="border border-sand hover:border-ember hover:text-ember transition text-xs font-medium py-2 rounded-lg">Retirer du panier</button>
            <a href="https://wa.me/${p.whatsapp}" target="_blank" class="flex items-center justify-center gap-1 border border-sand hover:border-[#25D366] hover:text-[#128C4A] transition text-xs font-medium py-1.5 rounded-lg">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 24 24"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.87.5 3.62 1.44 5.17L2 22l5.06-1.53a9.9 9.9 0 004.98 1.34c5.46 0 9.91-4.45 9.91-9.9C21.95 6.45 17.5 2 12.04 2zm5.8 14.13c-.24.68-1.4 1.3-1.93 1.38-.5.08-1.1.11-1.78-.11-.41-.13-.94-.3-1.62-.6-2.86-1.24-4.72-4.13-4.87-4.32-.14-.2-1.16-1.55-1.16-2.96 0-1.4.73-2.09 1-2.38.24-.27.53-.34.71-.34h.5c.16 0 .38-.02.58.45.24.56.79 1.94.86 2.08.07.14.12.31.02.5-.1.2-.15.31-.29.48-.15.17-.31.38-.44.51-.15.15-.3.31-.13.6.17.3.76 1.26 1.63 2.05 1.12 1 2.06 1.32 2.36 1.47.3.15.47.13.65-.08.18-.2.75-.87.95-1.17.2-.3.4-.24.66-.14.28.1 1.78.84 2.08 1 .3.15.5.23.57.36.07.13.07.75-.17 1.42z"/></svg>
              WhatsApp
            </a>
          </div>
        </div>
      `;
      grid.appendChild(card);
    });
  }

  let cartCount = 0;
  function addToCart(btn) {
    cartCount++;
    document.getElementById('cart-count').textContent = cartCount;
    const original = btn.textContent;
    btn.textContent = "Ajouté ✓";
    setTimeout(() => btn.textContent = original, 1200);
  }

  showBrand('Dell');
</script>
</body>
</html>
